DOWNLOAD_URLS:
  KNOWN_SITES_URL: None # OPTIONAL 
  REF_GENOME_URL: None # OPTIONAL 
  REF_INDEX_URL: None # OPTIONAL 

DOWNLOAD_FILES:
  KNOWN_SITES: "/path/to/output/downloaded/known_variants_chr{chr}.vcf" # OPTIONAL 
  REF_GENOME: "/path/to/output/downloaded/species.fa.gz" # OPTIONAL 
  REF_INDEX: "/path/to/output/downloaded/species.fa.fai" # OPTIONAL 
  FASTQ1: "path/to/{sample}_R1.fastq.gz" # OPTIONAL 
  FASTQ2: "path/to/{sample}_R2.fastq.gz" # OPTIONAL 

# These are connected to the snakefile via config["SPECIES"]
SPECIES: "species"
YAML: "/path/to/species.yaml"
CHROMO: [1,2A,2B,3,4,5,6,7,8,9,10]
PATH: "/path/to/output"
REF_GENOME: "/path/to/species.fa"
REF_INDEX: "/path/to/species.fa.fai" 
KNOWN_SITES: "/path/to/known_variants_chr{chr}.vcf"
DNM_FILTERS: "/path/to/de_novo_filters.py" # this python script contains all of the 10 filters and transmission filter
DNM_TABLES: "/path/to/de_novo_tables.py" # will create two tables for the overall drop of counts per filter and list all of the de novo mutations
DNM_GRAPH: "/path/to/de_novo_graph.py" # creates a graph to visualize the effects of the filters on the de novo mutations
MUT_SPEC: "/path/to/mutation_spectrum_graph.py" # the graph for the mutation specturm with error bars
mutation_types: ["AC", "CT", "CG", "CA", "AT", "AG"] # Used to search, calculate, and generate mutation spectrum for all of mutation types

# These are all of the modules, tools, and packages used in the snakefile
# SPECIAL NOTE: You can change the between these two formats, path or envmodules, in both YAML file and snakefile. 
# More detail in CONFIG_PARAMETERS.md
BGZIP: "/path/to/gzip" 
TABIX: "/path/to/tabix" 
SEQTK: "/path/to/seqtk" 
OLDBWA: "/path/to/oldBwa" 
SAMBLASTER: "/path/to/samblaster" 
GATK: "/path/to/gatk-4.1.9.0/gatk" 
SAMTOOLS: "/path/to/samtools" 
JAVA: "/path/to/java"  
BCFTOOLS: "/path/to/bcftools" 
BEDTOOLS: "/path/to/bedtools2" 
R: "/path/to/r" 
PYTHON: "/path/to/python" 

# Snakefile extracts the family's information as config["SAMPLES"]["mother"]["name"]
SAMPLES:
   mother: 
     name: &mom "A" # Mother Name or label
   father: 
     name: &dad "B" # Father Name or label
   child:
     gender: "*" # Optional: Offspring Gender as either Male, Female, or *
     name: &kid "C" # Offspring Name or label
   f2: 
     name: &grand "D" # Required: (Grandchild's Name or label) OR (False or None or "")
   quad:
     - *dad
     - *mom
     - *kid
     - *grand
   family:
     - *dad
     - *mom
     - *kid
     - *grand
     - "Extra grandchildern" # Add extra grandchildern by their Name or label to the pedigree 
